<div class="filters d-flex justify-content-end mb-3">

    <div class="content-filter mt-0">
        <form action="/filter/content" method="POST" class="input-group mb-3 d-flex">
            <span class="input-group-text">
                <button class="btn btn-white" type="submit">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                    </svg>
                </button>
            </span>
            <input class="form-control" type="text" name="content" placeholder="Filter by task name" aria-label="Search" maxlength="20">
        </form>
    </div>

    <div class="dropdown ms-3">
        <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            Filtrar por estado
        </button>
        <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="/filter/all">Todos</a></li>
            <li><a class="dropdown-item" href="/filter/true">Activo</a></li>
            <li><a class="dropdown-item" href="/filter/false">Inactivo</a></li>
        </ul>
    </div>
</div>
