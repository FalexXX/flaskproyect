{% extends 'base.html'%} 

{% block style %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
{% endblock %} 

{% block head %}
<title>Update Page</title>
{% endblock %} 

{% block body %}
<div class="content">
<h1>Update Task Master</h1>

<div class="form">
  <form action="/update/{{task.id}}" method="POST">
   <div class="mb-3">
       <label for="exampleInputEmail1" class="form-label">Task content</label>
       <input type="text form-control" name="content" id="content" value="{{task.content}}" required/><br />
    </div>
    <div class="mb-3">
        <select class="form-select" name="priority" id="priority" required>
            <option value="{{ task.priority }}" selected>{{ task.priority }}</option>
            {% for i in range(1, 6) %}
                {% if i != task.priority %}
                    <option value="{{i}}">{{i}}</option>
                {% endif %}
            {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        
        <select class="form-select" name="status" id="status" required>
          <option value="true" {% if task.status %} selected {% endif %}>Activo</option>
          <option value="false" {% if not task.status %} selected {% endif %}>Inactivo</option>
        </select>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1" />
        <label class="form-check-label" for="exampleCheck1">Check me out</label>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>
</div>
{% endblock %}
{% block script %} 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
{% endblock %}
